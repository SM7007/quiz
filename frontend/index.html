<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Quiz - Test Your Knowledge</title>
    <meta name="description" content="Take our interactive Python quiz and compete with others on the global scoreboard">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="card glass-card">
                <div class="card-header">
                    <h1>🐍 Python Quiz Challenge</h1>
                    <p>Test your Python knowledge and compete globally!</p>
                </div>
                <form id="login-form" class="form">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Start Quiz
                        <span class="btn-icon">→</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="card glass-card">
                <div class="quiz-header">
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <div class="quiz-info">
                        <span id="question-counter">Question 1 of 10</span>
                        <span id="score-display">Score: 0</span>
                    </div>
                </div>
                <div class="quiz-content">
                    <h2 id="question-text" class="question-text"></h2>
                    <div id="options-container" class="options-container"></div>
                </div>
                <button id="next-btn" class="btn btn-primary" style="display: none;">
                    Next Question
                    <span class="btn-icon">→</span>
                </button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <div class="card glass-card">
                <div class="result-header">
                    <div class="result-icon">🎉</div>
                    <h1>Quiz Complete!</h1>
                    <div class="final-score">
                        <span id="final-score">0</span>
                        <span class="score-label">/ 10</span>
                    </div>
                    <p id="result-message"></p>
                </div>
                <div class="result-actions">
                    <button id="view-scoreboard-btn" class="btn btn-primary">
                        View Scoreboard
                        <span class="btn-icon">🏆</span>
                    </button>
                    <button id="retake-btn" class="btn btn-secondary">
                        Retake Quiz
                    </button>
                </div>
            </div>
        </div>

        <!-- Scoreboard Screen -->
        <div id="scoreboard-screen" class="screen">
            <div class="card glass-card">
                <div class="card-header">
                    <h1>🏆 Global Scoreboard</h1>
                    <p>Top Python Quiz Masters</p>
                </div>
                <div id="scoreboard-container" class="scoreboard-container">
                    <div class="loading">Loading scoreboard...</div>
                </div>
                <button id="back-to-result-btn" class="btn btn-secondary">
                    ← Back to Results
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
